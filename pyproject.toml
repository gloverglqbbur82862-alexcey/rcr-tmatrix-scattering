[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcr-tmatrix-scattering"
version = "0.1.0"
description = "Matrix-free RCR T-matrix scattering for sphere aggregates"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "RCR T-matrix Scattering contributors" }
]
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.14,<2",
  "numba>=0.61,<1",
  "PyYAML>=6.0,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "matplotlib>=3.8,<4",
  "pydantic>=2,<3",
  "plotly>=5.24,<6"
]
gpu = [
  "cupy-cuda12x>=13,<14"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rcr_scattering*", "rcr_engine*", "math_core*", "geometry*", "solver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/rcr_scattering"]
