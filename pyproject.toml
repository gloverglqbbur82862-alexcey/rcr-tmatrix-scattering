[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast_mtp_rcr_scattering"
version = "0.1.0"
description = "A high-performance Python-Numba JIT-accelerated electromagnetic scattering engine using exact RCR and analytical orientation averaging."
requires-python = ">=3.10, <3.14"
license = {text = "MIT"}
dependencies = [
    "numpy>=2.2.0",
    "scipy>=1.14.0",
    "numba>=0.61.0"
]

[project.optional-dependencies]
workbench = [
    "streamlit>=1.38.0",
    "plotly>=5.24.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0"
]
test = [
    "pytest>=9.0.0",
    "streamlit>=1.38.0",
    "plotly>=5.24.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rcr_engine*", "solver*", "fmm*", "geometry*", "math_core*", "apps*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
